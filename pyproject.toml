[project]
name = "vozii"
description = "Lokales Voice-to-Text fuer Windows 11"
requires-python = ">=3.12"
dynamic = ["version"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Bewusst schlank: Fehler + offensichtliche Probleme, kein Stil-Bikeshedding
select = ["E", "F", "W", "B", "UP"]
ignore = [
    "E501",  # Zeilenlaenge — Log-/Fehlertexte duerfen lang sein
    "E701",  # Einzeiler wie `if not x: return` sind hier bewusster Stil
    "E741",  # kurze Namen in kleinen Schleifen ok
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
