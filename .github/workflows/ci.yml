name: CI

on:
  # Laeuft nur beim Release-Tag (v*): erst Tests, dann exe bauen und anhaengen.
  # Kein Lauf bei jedem Push/PR mehr (27.10.2026) - geprueft wird lokal.
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip freeze
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip freeze
      - name: Build exe
        run: python scripts/build.py
      - name: SHA256SUMS
        shell: pwsh
        run: |
          (Get-FileHash dist/VoZii.exe -Algorithm SHA256).Hash.ToLower() + " *VoZii.exe" |
            Out-File dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt
      - name: Upload release asset
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/VoZii.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
